<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <div class="topo">
      <h1>🔒 Gerador de senhas</h1>
      <p>Gere instantaneamente uma senha aleatória e segura</p>
    </div>

    <div class="senha-box">
      <label>Senha</label>
      <input type="text" id="senha" readonly>
    </div>

    <div class="painel">

      <div class="comprimento">
        <h3>Número de caracteres</h3>
        <div class="controle">
          <button onclick="diminuir()">-</button>
          <span id="valor">12</span>
          <button onclick="aumentar()">+</button>
        </div>
      </div>

      <div class="opcoes">
        <h3>Características da senha</h3>

        <label><input type="checkbox" id="maiusculas" checked> Letras maiúsculas</label>
        <label><input type="checkbox" id="minusculas"> Letras minúsculas</label>
        <label><input type="checkbox" id="numeros"> Números</label>
        <label><input type="checkbox" id="simbolos"> Símbolos</label>

        <button onclick="gerarSenha()">Gerar senha</button>
      </div>

      <div class="forca">
        <h3>Força da senha</h3>
        <div class="barra">
          <div id="barraForca"></div>
        </div>
        <p id="textoForca">Fraca</p>
        <small id="tempo">Tempo estimado...</small>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
